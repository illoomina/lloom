[workspace]
members = [
    "lloom-tensor",
    "lloom",
    "lloom-engine",
    "lloom-macros",
    "candle-examples",
    "candle-ug",
    "candle-wasm-tests",
    "tensor-tools",
]
# RESTRUCTURING §7.1: the engine is the two-crate floor (lloom-tensor +
# lloom). The crates below consume candle-nn/candle-transformers, which no
# longer exist under those names after the merge; they are peripheral consumers,
# not the engine, and none builds in the default gate on this metal-only machine
# (pyo3 needs a Python extension toolchain, the wasm examples need the wasm
# target). They are kept in-tree for the breadth CI (§7.4) but moved out of the
# default workspace until they are repointed at lloom (see the PR's
# "what was NOT done" — the downstream-consumer decision is surfaced for the
# owner, §6). candle-book/flash-attn/flash-attn-v3/kernels/onnx were already
# excluded upstream.
exclude = [
    "candle-datasets",
    "candle-pyo3",
    "candle-wasm-examples",
    # The #656 browser-runner spike: wasm32-only, its own workspace root. Its
    # wasm deps (getrandom js backends, wasm-bindgen) must not enter the
    # metal-only default resolve. Build it with `--target wasm32-unknown-unknown`
    # from lloom-wasm/ (see its README).
    "lloom-wasm",
    "candle-book",
    "candle-flash-attn",
    "candle-flash-attn-v3",
    "candle-kernels",
    "candle-onnx",
    # The LibAFL harnesses (lloom #706): their own workspace root, because they are
    # built with SanitizerCoverage passes on every target crate and pull a
    # dependency tree the engine never links. Build from lloom-fuzz/ (see its
    # README).
    "lloom-fuzz",
]
resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2021"
description = "Minimalist ML framework."
repository = "https://github.com/illoomina/lloom"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ab_glyph = "0.2.23"
accelerate-src = { version = "0.3.2" }
anyhow = { version = "1", features = ["backtrace"] }
byteorder = "1.4.3"
lloom-tensor = { path = "./lloom-tensor", version = "0.11.0" }
lloom = { path = "./lloom", version = "0.11.0" }
# The serving engine (RESTRUCTURING §4, §7.1): decode loop + request seam over
# lloom's tier-1 API. Consumed by amber; consumes lloom, never the reverse.
lloom-engine = { path = "./lloom-engine", version = "0.11.0" }
# The engine's derive macros (RESTRUCTURING §1.6): #[derive(Config)] emits the
# clap flags and the within-crate `AXES` distributed-slice contributions.
lloom-macros = { path = "./lloom-macros", version = "0.11.0" }
# The within-crate axis registry the derive contributes to, collected at link
# time (RESTRUCTURING §1.6, feasibility-checked at HEAD on rustc 1.96.0).
linkme = "0.3.37"
# The optimizer's rewrite substrate (`design/docs/optimizer-design.md` §2.13):
# equality saturation + Datalog, pure Rust. `bin` (its CLI, graphviz, mimalloc)
# is off; only the library is linked.
egglog = { version = "3.0.0", default-features = false }
# Transitional alias: candle-examples/candle-ug/candle-wasm-tests/tensor-tools
# still name `candle::` (the tensor layer). Kept resolving to lloom-tensor so
# those crates build unchanged; the engine crates now name `lloom_tensor::`
# directly. Dropped when the remaining `candle::` consumers are repointed.
candle = { path = "./lloom-tensor", package = "lloom-tensor", version = "0.11.0" }
candle-datasets = { path = "./candle-datasets", version = "0.11.0" }
candle-flash-attn = { path = "./candle-flash-attn", version = "0.11.0" }
candle-hub = { path = "./candle-hub", version = "0.11.0" }
candle-flash-attn-v3 = { path = "./candle-flash-attn-v3", version = "0.11.0" }
candle-kernels = { path = "./candle-kernels", version = "0.11.0" }
candle-onnx = { path = "./candle-onnx", version = "0.11.0" }
candle-ug = { path = "./candle-ug", version = "0.11.0" }
clap = { version = "4.2.4", features = ["derive"] }
criterion = { version = "0.8", default-features = false }
cudarc = { version = "0.19.8", features = [
    "std",
    "cublas",
    "cublaslt",
    "curand",
    "driver",
    "nvrtc",
    "f16",
    "f8",
    "cuda-version-from-build-system",
    "dynamic-linking",
], default-features = false }
fancy-regex = "0.18.0"
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
hf-hub = "0.5.0"
half = { version = "2.5.0", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
    "zerocopy"
] }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
hound = "3.5.1"
image = { version = "0.25.2", default-features = false, features = [
    "jpeg",
    "png",
] }
imageproc = { version = "0.26.0", features = [
    "text",
], default-features = false }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
libc = { version = "0.2.147" }
libm = { version = "0.2.15" }
log = "0.4"
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num_cpus = "1.15.0"
num-traits = "0.2.15"
parquet = "58"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.8.0"
serde = { version = "1.0.171", features = ["derive"] }
serde_plain = "1.0.2"
serde_json = "1.0.99"
# lloom-macros' proc-macro deps (RESTRUCTURING §1.6).
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
thiserror = "2"
tokenizers = { version = "0.22.0", default-features = false }
# `release_max_level_info` compiles out every TRACE and DEBUG span/event in RELEASE
# builds at COMPILE TIME — they become no-ops the optimizer removes entirely, so
# the hot-path `span.enter()`s (mlp/attn/attn-rot/shortconv, all `Level::TRACE`,
# ~30+ per forward × thousands of forwards) cost NOTHING in release. Debug/profile
# builds keep them for tracing. No code change — the spans stay in the source; the
# feature just gates their expansion.
tracing = { version = "0.1.37", features = ["release_max_level_info"] }
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"
ug = "0.5.0"
ug-cuda = "0.5.0"
ug-metal = "0.5.0"
yoke = { version = "0.8.1", features = ["derive"] }
zip = { version = "9.0.4", default-features = false }
zerocopy = "0.8"
objc2-metal = { version = "0.3.2", features = ["block2"] }
objc2-foundation = { version = "0.3.2" }
objc2 = { version = "0.6.3" }
block2 = { version = ">=0.6.1, <0.8.0", features = ["alloc"], default-features = false }
once_cell = "1.21"
parking_lot = "0.12"

# The shipping tier: one codegen unit and whole-program (fat) LTO. Fat LTO
# moves no digest and no resolvable decode time against thin, and costs build
# memory and time (docs/architecture.md §14.5e).
#
# Shipping aborts on bugs and strips symbols. Optional attribution diagnostics also
# require the `profile` feature; Cargo profile names do not select features.
# Symbol material for this exact artifact must be retained separately.
# Investigation builds below deliberately keep unwinding.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Maintainer decision 26 (#990, 2026-10-14): the shipped binary does not
# unwind and carries no symbols. A panic is a bug and ends the process;
# recoverability comes from `Result`, not from catching an unwind. Tests and
# the `ci` profile keep unwinding (nextest needs panics as failures);
# `release-with-debug` below keeps symbols for the tracing instruments.
panic = "abort"
strip = "symbols"

# Production panic strategy with symbols: distinct from the unwind investigation
# build. This is not asserted byte-identical to a separately stripped binary.
[profile.release-symbols]
inherits = "release"
debug = true
strip = false

[profile.release-with-debug]
inherits = "release"
debug = true
# The diagnosis build: the release codegen with symbols kept, so
# `LLOOM_POOL_TRACE` / `LLOOM_SERVED_REQUEST_TRACE` name their frames and a
# backtrace reads; it unwinds so a panic under investigation can be caught.
panic = "unwind"
strip = false

# The CI test tier: the dev profile's checks (debug assertions, overflow
# checks) at a codegen that links a test binary a runner's disk can hold.
# Full debug info on every test binary of `lloom` (129 of them, each
# statically linking the engine) filled a 72 GB runner (lloom #939);
# `line-tables-only` keeps the panic backtraces and drops the type
# information nobody reads in CI. A failing test is rerun under `dev` for
# the debugger. `opt-level = 2` changes no result: Rust emits no fused or
# reassociated float arithmetic at any opt level, and
# `measurements/issue-939.md` §6 shows the digests unmoved.
[profile.ci]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# The sanitizer tier (#475). A CORRECTNESS arm, and the profile exists so that
# is a property of the tree rather than of an invocation nobody recorded —
# §14.5a's own lesson, where the codegen flags above were `--config`-passed and
# unrecorded until they were made a property of this manifest.
#
# Use:
#
#     RUSTFLAGS="-Zsanitizer=address" cargo +nightly build \
#         --profile sanitize --target aarch64-apple-darwin --features metal
#
# `--target` is REQUIRED and is not a portability flourish: without it cargo
# builds build scripts and proc macros with the same RUSTFLAGS, and they run in
# a process with no sanitizer runtime. It is free here — the triple is native.
#
# `-Zbuild-std` is NOT required. That is measured rather than assumed (#475):
# the first attempt asked for `rust-src` and the run without `build-std` works.
# It matters because `build-std` rebuilds core and alloc, which would make this
# arm far more expensive for nothing.
#
# LeakSanitizer is NOT available. `-Zsanitizer=leak` fails at
# `rustc` with "leak sanitizer is not supported for this target" — so ASan is
# the arm, and its own `detect_leaks` is a different thing that is worth
# checking and is not LSan.
[profile.sanitize]
inherits = "release"
# Debug info so a report names a line rather than an address. ASan reports are
# a stack or they are nothing, and the probe runs for #475 confirm the stacks
# resolve to file and line under this setting.
debug = true

# NOT set here: `force-frame-pointers`. It is a `rustc -C` flag and NOT a cargo
# profile key -- written as one it is accepted silently and does nothing, which
# cargo says out loud only as `warning: unused manifest key`. Caught that way
# while running clippy for #475, and recorded rather than quietly deleted
# because it is §2.4's shape in a manifest: a setting that looks applied, is
# not, and whose absence nothing else would report. `-Zsanitizer=address`
# already implies the frame pointers the unwinder needs.

# NOT inherited from `[profile.release]`, deliberately, and this is the
# load-bearing line rather than a tuning choice.
#
# §14.5c/#445 measured `lto = "thin"` DELETING the null-pointer check on the
# logits readback, its counter and its blit fallback — the tier SIGSEGVs on
# every decode run until repaired — and §11.5e then measured the same elision
# at `opt-level = 1` with LTO OFF. So an optimised build removes guards, and a
# sanitizer run under one would attribute an elision defect to whatever the
# sanitizer happened to report. Holding LTO off keeps the two separable: a
# finding here is the sanitizer's.
lto = false
# Follows from the same argument. `codegen-units = 1` is what the release tier
# uses to get one object; it buys nothing for a correctness arm and it is one
# more difference between this build and the one whose behaviour is under test.
codegen-units = 16

# Owned pinned transport repair; public mirror retains this relative locus.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
