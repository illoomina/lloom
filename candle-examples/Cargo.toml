[package]
name = "candle-examples"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
candle = { workspace = true }
candle-datasets = { workspace = true, optional = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
candle-flash-attn = { workspace = true, optional = true }
candle-onnx = { workspace = true, optional = true }
# Metal-only, and optional so the CPU and CUDA builds compile none of it
# (`DESIGN.md` §14.1). The determinism harness needs it to select the
# binding-style axis (issue #115), which is a `candle-metal-kernels` switch with
# no `candle-core` surface.
candle-metal-kernels = { workspace = true, optional = true }

chrono = "0.4"
csv = "1.3.0"
cudarc = { workspace = true, optional = true }
half = { workspace = true, optional = true }
# `lfm2-load-profile` reads page residency with `mincore(2)` so its cold-cache
# precondition is proved rather than assumed (issue #298).
libc = { workspace = true }
hf-hub = { workspace = true, features = ["tokio"] }
image = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
minijinja = { version = "2", features = ["loader"] }
palette = { version = "0.7.6", optional = true }
enterpolation = { version = "0.3.0", optional = true }
pyo3 = { version = "0.27", features = [
    "auto-initialize",
    "abi3-py311",
], optional = true }
rayon = { workspace = true }
rubato = { version = "2", optional = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
symphonia = { version = "0.6.0", features = ["all"], optional = true }
tokenizers = { workspace = true, features = ["onig"] }
cpal = { version = "0.17.3", optional = true }
pdf2image = { version = "0.1.2", optional = true }
tekken-rs = { version = "0.1.1", optional = true }

[dev-dependencies]
anyhow = { workspace = true }
byteorder = { workspace = true }
clap = { workspace = true }
imageproc = { workspace = true }
memmap2 = { workspace = true }
rand = { workspace = true }
ab_glyph = { workspace = true }
tracing = { workspace = true }
tracing-chrome = { workspace = true }
tracing-subscriber = { workspace = true }
# Necessary to disambiguate with tokio in wasm examples which are 1.28.1
#
# `sync` and `rt` are named rather than left to default: `lfm2-decode-profile`'s
# `--seam` arm reproduces ambrogio's streaming seam, which is a
# `tokio::sync::mpsc::channel(32)` fed by `blocking_send` from inside
# `spawn_blocking`. Pricing that seam requires the *same* primitive -- a
# hand-rolled channel would measure a different one -- and neither feature is on
# by default. `full` is deliberately not taken: it pulls in the net, time and
# process stacks this example never touches, and a feature union is global to
# the build (lloom #412).
tokio = { version = "1.48.0", features = ["sync", "rt"] }

[build-dependencies]
anyhow = { workspace = true }
cudaforge = { version = "0.1.2", optional = true }
hf-hub = { workspace = true, features = ["tokio"] }

[features]
default = []
accelerate = [
    "dep:accelerate-src",
    "candle/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
cuda = [
    "candle/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "dep:cudaforge",
]
cudnn = ["candle/cudnn", "candle-nn/cudnn", "candle-transformers/cudnn"]
flash-attn = ["cuda", "candle-transformers/flash-attn", "dep:candle-flash-attn"]
mkl = [
    "dep:intel-mkl-src",
    "candle/mkl",
    "candle-nn/mkl",
    "candle-transformers/mkl",
]
nccl = ["cuda", "cudarc/nccl", "dep:half"]
onnx = ["candle-onnx"]
# `candle-transformers/metal` is here because a model may carry Metal-only
# behaviour, and without it that behaviour silently compiles to its non-Metal
# stub in every example. `lfm2::Cache::admit_memory_budget` (§9.5l) is the case
# that found it: the check is `#[cfg(feature = "metal")]`, so every harness was
# building the inert arm and admission never ran however it was configured.
#
# **Pre-existing, and invisible because nothing in `candle-transformers` was
# gated on `metal` before** -- an unused feature flag reads exactly like a
# correct one. Note the line below already propagates
# `candle-transformers/metal-debug-labels`, which is what makes the omission
# here an oversight rather than a decision.
metal = [
    "candle/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "dep:candle-metal-kernels",
]
metal-debug-labels = ["metal", "candle/metal-debug-labels", "candle-nn/metal-debug-labels", "candle-transformers/metal-debug-labels"]
# Strict ordering verification (#185, `DESIGN.md` §11.3t), reachable from a
# harness because this line exists -- #205's defect below, avoided rather than
# repeated.
#
# **Only `candle` is named**, per the rule the next entry states and counts:
# `grep -rn 'feature = "hazard-audit"'` over the tree hits
# `candle-metal-kernels` **30 times and no other crate**. The first version of
# this line also named `candle-nn` and `candle-transformers`, by symmetry with
# `metal-debug-labels` above; those two names propagated to no gated code, which
# is exactly what that rule predicts and why it is stated once below rather than
# twice.
#
# The reach is `candle/metal-hazard-audit` -> `candle-metal-kernels/hazard-audit`,
# asserted by a **run** rather than by this comment:
# `lfm2-dispatch-trace --assert-hazard-audit` evaluates `cfg!` in this crate and
# exits non-zero when the feature did not arrive, and `cargo metadata` resolves
# `candle-metal-kernels` to `['default', 'hazard-audit']` against `['default']`
# under `--features metal` alone.
metal-hazard-audit = ["metal", "candle/metal-hazard-audit"]
# Per-memory-class and event telemetry (#171, `DESIGN.md` §3.4a-iv), reachable
# from a harness for the first time (#205).
#
# **This is §9.5l finding 5's shape one crate over, and the line above is what
# makes it an oversight rather than a decision.** `candle-core` has declared
# `metal-run-telemetry` since #171 and nothing above it did, so
# `grep -rn 'metal-run-telemetry' --include=Cargo.toml` returned exactly one
# line and no example could be built with `run_telemetry` compiled in. §16 P0 #7
# recorded the instrument as *"never run at long context"*, which read as *has
# not yet been* where it was *cannot currently be*.
#
# Only `candle` is named, and that is the whole propagation rather than an
# omission: every `run_telemetry` entry point lives in
# `candle-metal-kernels::metal::run_telemetry`, reached as
# `candle/metal-run-telemetry` -> `candle-metal-kernels/run-telemetry`.
# Checked rather than assumed, since asserting a propagation nobody verified is
# the defect this line exists to fix: `grep -rn 'feature = "run-telemetry"'`
# over the tree hits `candle-metal-kernels/src/metal/run_telemetry.rs` and
# nothing else, and `cargo metadata --features metal-run-telemetry` resolves
# `candle-metal-kernels` to `['default', 'run-telemetry']` where `--features
# metal` resolves it to `['default']`.
#
# **`metal-debug-labels` above names three crates and that is NOT the shape to
# copy here** -- counted, its `#[cfg]` sites are 6 in `candle-core` and 10 in
# `candle-metal-kernels` and **0 in both `candle-nn` and
# `candle-transformers`**, so two of its three names propagate to no gated code
# today. Following it by symmetry would have added two more such names. The
# rule that survives is per-feature and mechanical: **name the crate that gates
# code on it, found by grep, not the crate that a sibling feature happens to
# name.**
metal-run-telemetry = ["metal", "candle/metal-run-telemetry"]
microphone = ["cpal", "rubato"]
encodec = ["cpal", "symphonia", "rubato"]
mimi = ["cpal", "symphonia", "rubato"]
snac = ["cpal", "symphonia", "rubato"]
