[package]
name = "candle-metal-kernels"
version = "0.11.0"
edition = "2021"

description = "Metal kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"


[features]
default = []
# Emit per-dispatch Metal debug groups for Xcode GPU captures / Instruments.
debug-labels = []
# Per-memory-class and event telemetry on a CLOCK_UPTIME_RAW timeline (#171).
#
# Composes with a RELEASE build -- it is not a debug build and not a permanent
# cost. Off, every entry point in `metal::run_telemetry` is an empty inline
# function, following `debug-labels`'s shape, so there is no call to elide and
# no state to allocate.
run-telemetry = []
# Strict ordering verification: reconstruct the dependency graph at runtime and
# assert every RAW/WAW/WAR edge is covered by a barrier, a fence, or an
# encoder-session boundary (#185).
#
# Composes with a RELEASE build, following `run-telemetry`. Off, every entry
# point in `metal::hazard_audit` is an empty inline function that drops its
# arguments, so there is no call to elide and no state to allocate.
#
# Diagnostic rather than a gate: §15.1's gates each exist because a specific
# failure demanded them, and this answers a question the digest gate
# structurally cannot -- #144 measured a wrong predicate leaving both canonical
# digest pairs byte-identical over three runs.
hazard-audit = []
# ASan shadow-memory poisoning for allocator invariants plain ASan cannot see
# (#475): a pool buffer in the free list, an arena region not handed out.
#
# Follows `run-telemetry`'s shape -- off, every entry point in `metal::poison`
# is an empty inline function that drops its arguments -- with one difference
# that matters: this one is NOT free to enable on its own. It calls the
# sanitizer runtime's `__asan_*` interface, so a build with this feature and
# without `-Zsanitizer=address` does not link.
#
# So it is enabled by the `sanitize` profile and by nothing else. That profile
# is documented in the workspace manifest; the short form is
#
#     RUSTFLAGS="-Zsanitizer=address" cargo +nightly build \
#         --profile sanitize --target aarch64-apple-darwin \
#         --features metal,asan-poison
#
# A CORRECTNESS arm. ASan changes the allocator and §11.5e measures the
# readback's arm choice as allocator-state-dependent (blit 1..12 over four runs
# of one binary), so ANY TIMING TAKEN UNDER IT IS MEANINGLESS.
asan-poison = []

[dependencies]
half = { version = "2.5.0", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
] }
once_cell = "1.21"
thiserror = "2"
tracing = "0.1.41"
objc2-metal = { version = "0.3.2", features = ["block2"] }
block2 = { version = ">=0.6.1, <0.8.0", features = ["alloc"], default-features = false }
objc2 = "0.6.3"
objc2-foundation = "0.3.2"

[dev-dependencies]
clap = { version = "4.5.49", features = ["derive"] }
half = { version = "2.7.1", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
] }
anyhow = "1"
rand = "0.9.2"
rand_distr = "0.5.1"
proptest = "1.11"

[[example]]
name = "hazard_audit_crosscheck"
# The whole example consumes `metal::hazard_audit`, which is `#[cfg]`-gated, so
# without the feature there is nothing for it to call. `required-features` skips
# it rather than failing the build -- an unconditional example would make
# `cargo test` on the default feature set red, which is the shipping path.
required-features = ["hazard-audit"]

[profile.profiling]
inherits = "release"
debug = 2

# The sanitizer tier (#475), duplicated here because this crate is
# `exclude`d from the workspace and so does not inherit the workspace
# manifest's profiles. The workspace copy carries the full argument -- why
# `--target` is required, why `-Zbuild-std` is not, why LSan is out, and above
# all why LTO is held OFF (#445 measured `lto = "thin"` deleting a null guard,
# and #454 measured the same elision at `opt-level = 1` with LTO off, so an
# optimised build would confound an elision defect with a sanitizer finding).
#
# Kept byte-identical to the workspace copy on purpose: two tiers under one
# name would make a figure taken here incomparable with one taken there, which
# is §2.5's own subject.
[profile.sanitize]
inherits = "release"
debug = true
lto = false
codegen-units = 16
