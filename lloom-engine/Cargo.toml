[package]
name = "lloom-engine"
version.workspace = true
edition.workspace = true
description = "The serving engine: the decode loop, sampling and the streaming request seam over lloom's tier-1 API."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
# One integration-test binary (`tests/main.rs`, lloom #939): the `tests/*.rs`
# files are its modules, declared there. A file that owns its binary (a
# `#[global_allocator]`) is listed below.
autotests = false

[dependencies]
# The inference core (RESTRUCTURING §7.1): the serving engine links lloom's
# tier-1 API only -- CausalLM/Session/LogitsProcessor, the lfm2 model -- never
# its internals (§7.1b). lloom-tensor comes through lloom for Tensor/Device.
# The seam names no tokenizer library: the decode loop takes a detokenize
# closure and the request seam takes a rendered prompt string, so the consumer
# owns encoding (amber and the engine were on different `tokenizers` majors —
# coupling them through the seam would force a lockstep bump). Kept out on
# purpose.
lloom = { workspace = true }
lloom-tensor = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }

# The `lloom-serve` binary only (feature `serve`): the library stays free of a
# tokenizer, an HTTP stack and a template engine. A consumer that links the
# library pays for none of these.
anyhow = { workspace = true, optional = true }
# The option groups (`options.rs`, `#[derive(Options)]`): the flags, the
# dotted keys and the JSON of every mechanism the engine drives are generated
# from one struct per group, so the library carries the derive's deps.
lloom-macros = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true, features = ["onig"], optional = true }
tiny_http = { version = "0.12", optional = true }
hf-chat-template = { version = "1.0", optional = true }
# The variables a checkpoint's chat template reads (`app/template.rs`): the
# static analysis hf-chat-template does not expose. The same crate it renders
# with, so the parse is the renderer's own.
minijinja = { version = "2", features = ["loop_controls"], optional = true }
# `lloom chat`'s per-turn `tokens_sha256` (the LFM2 harnesses' digest, so a
# reply is comparable to `lfm2-determinism` without a second path to the model).
sha2 = { version = "0.10", optional = true }
# Image input on `lloom chat|serve` (OpenAI `image_url` parts): PNG/JPEG
# decoding and the base64 of a `data:` URL. The binary's only; the library
# composes image rows and names no codec.
image = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }
# Audio input on `/v1/systemone` (d1-omni's clip): WAV and FLAC, decoded to
# the 16 kHz mono samples the model reads. The binary's only.
symphonia = { version = "0.6", default-features = false, features = ["flac", "wav", "pcm"], optional = true }
# `lloom chat --verbose`'s page-fault count over a turn (`getrusage`).
libc = { workspace = true, optional = true }
# The sampling group draws a fresh seed when none is given (the library too).
rand = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"

[dev-dependencies]
anyhow = { workspace = true }
# The option schema's patterns, checked against the loader in a test.
regex = "1"
# Examples encode/decode; the library itself names no tokenizer library (the
# seam takes a rendered prompt and a detokenize closure), so this is dev-only.
tokenizers = { workspace = true, features = ["onig"] }
serde_json = { workspace = true }

[[example]]
name = "decode-smoke"
# The example loads a real checkpoint, which needs a device; Metal is the only
# backend on this machine. The loop itself is backend-agnostic.
required-features = ["metal"]

[[bin]]
name = "lloom"
path = "src/bin/lloom/main.rs"
required-features = ["serve"]

# `lloom serve` under the name the pipette runner spawns.
[[bin]]
name = "lloom-serve"
path = "src/bin/lloom-serve/main.rs"
required-features = ["serve"]

[features]
default = []
# Forwarded to lloom so a serving binary built for Metal pulls the Metal
# kernels through the one dependency edge. CPU and CUDA stay buildable
# (CONTRIBUTING §4.1) because the engine names no backend directly.
metal = ["lloom/metal"]
cuda = ["lloom/cuda"]
accelerate = ["lloom/accelerate"]
mkl = ["lloom/mkl"]
# The optimized diagnostic build (`lloom`'s `profile`): the per-step decode
# instrumentation a plain release compiles out. The keys that need it say
# so (`lloom options --compiled`).
profile = ["lloom/profile"]
# The `lloom-serve` binary: the OpenAI-compatible endpoint and the benchmark
# sidecar contract over the engine (issue #695). Backend-agnostic on its own;
# pair with `metal` on Apple silicon.
serve = [
    "dep:anyhow",
    "dep:tokenizers",
    "dep:tiny_http",
    "dep:hf-chat-template",
    "dep:minijinja",
    "dep:sha2",
    "dep:image",
    "dep:base64",
    "dep:libc",
    "dep:symphonia",
]
