[package]
name = "lloom"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
# The tensor layer (candle-core + candle-metal-kernels merged, RESTRUCTURING
# §7.1). Named `lloom-tensor`; the merged nn+transformers sources import it as
# `lloom_tensor::`.
lloom-tensor = { workspace = true }
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
candle-flash-attn = { workspace = true, optional = true }
fancy-regex = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_plain = { workspace = true }
tracing = { workspace = true }
# Merged in from candle-nn (RESTRUCTURING §7.1): the nn module's own deps.
half = { workspace = true }
thiserror = { workspace = true }
hf-hub = { workspace = true }
tokenizers = { workspace = true, features = ["onig"] }
safetensors = { workspace = true }
objc2-metal = { workspace = true, optional = true }
libc = { workspace = true }

[dev-dependencies]
# The stateful sequence fuzzer over `TokenRing` (lloom #508). A dev-dependency,
# so nothing shipping and no downstream consumer acquires it -- which is what
# keeps `CONTRIBUTING.md` §4.1's "must not break CPU or CUDA backends" a
# non-question here: the target is a test, backend-agnostic, and runs on
# whichever of CPU and Metal is present.
proptest = "1.11"
# Merged in from candle-nn dev-deps (used by its tests and examples).
anyhow = { workspace = true }
clap = { workspace = true }
rand_distr = { workspace = true }
criterion = { workspace = true }

[features]
default = []
accelerate = ["dep:accelerate-src", "lloom-tensor/accelerate"]
cuda = ["lloom-tensor/cuda"]
cudnn = ["lloom-tensor/cudnn"]
flash-attn = ["cuda", "dep:candle-flash-attn"]
mkl = ["dep:intel-mkl-src", "lloom-tensor/mkl"]
metal = ["lloom-tensor/metal", "dep:objc2-metal"]
metal-debug-labels = ["metal", "lloom-tensor/metal-debug-labels"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "cpu_benchmarks"
