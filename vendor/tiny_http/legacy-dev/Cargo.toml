[package]
autoexamples = false
autobenches = false
autotests = false
name = "tiny_http-legacy-dev"
version = "0.12.0"
authors = ["pierre.krieger1708@gmail.com",
           "Corey Farwell <coreyf@rwell.org>"]
description = "Low level HTTP server library"
documentation = "https://tiny-http.github.io/tiny-http/tiny_http/index.html"
keywords = ["http", "server", "web"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-http/tiny-http"
edition = "2018"

[features]
default = []
ssl = ["ssl-openssl"]
ssl-openssl = ["openssl", "zeroize"]
ssl-rustls = ["rustls", "rustls-pemfile", "zeroize"]

[dependencies]
ascii = "1.0"
chunked_transfer = "1"
log = "0.4.4"
httpdate = "1.0.2"

openssl = { version = "0.10", optional = true }
rustls = { version = "0.20", optional = true }
rustls-pemfile = { version = "0.2.1", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
rustc-serialize = "0.3"
sha1 = "0.6.0"
fdlimit = "0.1"

[package.metadata.docs.rs]
# Enable just one SSL implementation
features = ["ssl-openssl"]

# SAME implementation, preserved upstream examples/tests/benchmark entrypoints.
[lib]
name = "tiny_http"
path = "../src/lib.rs"

[dependencies.parking_lot]
version = "0.12"

[dev-dependencies.serde_json]
version = "1"

[workspace]

[[example]]
name = "hello-world"
path = "../examples/hello-world.rs"

[[example]]
name = "php-cgi"
path = "../examples/php-cgi.rs"

[[example]]
name = "readme-example"
path = "../examples/readme-example.rs"

[[example]]
name = "serve-root"
path = "../examples/serve-root.rs"

[[example]]
name = "ssl"
path = "../examples/ssl.rs"
required-features = ["ssl"]

[[example]]
name = "websockets"
path = "../examples/websockets.rs"

[[test]]
name = "input-tests"
path = "../tests/input-tests.rs"

[[test]]
name = "network"
path = "../tests/network.rs"

[[test]]
name = "non-chunked-buffering"
path = "../tests/non-chunked-buffering.rs"

[[test]]
name = "promptness"
path = "../tests/promptness.rs"

[[test]]
name = "simple-test"
path = "../tests/simple-test.rs"

[[test]]
name = "unblock-test"
path = "../tests/unblock-test.rs"

[[test]]
name = "unix-test"
path = "../tests/unix-test.rs"

[[bench]]
name = "bench"
path = "../benches/bench.rs"
